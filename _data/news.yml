- date: 5. May 2026
  headline: Opening Meeting with International Experts to start off the DarTwin Project.  
  image: /images/newspic/2025-05-Wolfrath-Meeting.jpg
  maintext: >
    We used the chance that all senior project members and all international experts were present 
    at the [2nd Workshop on Next-Gen DT Engineering](https://set.win.tue.nl/event/2nd-workshop-on-next-gen-dt-engineering/), 
    to hold the first official DarTwin project meeting.
    
    We had a very fruitful discussion reviewing the project goals and the work plan, and we are looking forward to a successful project!

